# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: "elm-land"

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    defaults:
      run:
        working-directory: projects/cli

    name: "Node.js"
    runs-on: macos-15

    strategy:
      matrix:
        # Vite 8 and chokidar 5 need Node ^20.19.0 || >=22.12.0
        node-version: [20, 22, 24]

    steps:
      - name: "Checkout latest code"
        uses: actions/checkout@v7
      - name: "Install pnpm"
        uses: pnpm/action-setup@v6
        with:
          package_json_file: projects/cli/package.json
      - name: Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: projects/cli/pnpm-lock.yaml
      - name: "Install dependencies"
        run: pnpm install --frozen-lockfile
      - name: "Build Elm code generator"
        run: pnpm run setup
      - name: "Make elm-land available in terminal"
        run: npm link
      - name: "Run test suite"
        run: pnpm test
